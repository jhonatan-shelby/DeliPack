# nginx entrega imágenes, CSS y JS directamente (rápido) y pasa lo demás a Django.
upstream delipack { server web:8000; keepalive 16; }

server {
    listen 80;
    server_name _;
    client_max_body_size 6m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml text/plain application/json;
    gzip_vary on;

    # CSS, JS y fuentes: el nombre incluye una huella, así que pueden guardarse un año
    location /static/ {
        alias /srv/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Fotos de productos subidas desde el panel
    location /media/ {
        alias /srv/media/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    location / {
        proxy_pass http://delipack;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }
}
